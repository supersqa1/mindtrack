<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindtrack - Learning Progress Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Mindtrack</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="demoLink">Demo Data</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="registerLink">Register</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="loginLink">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Demo Section -->
        <div id="demoSection" class="section">
            <h2>Demo Projects</h2>
            <div id="demoProjects" class="row"></div>
            
            <h2 class="mt-4">Demo Tasks</h2>
            <div id="demoTasks" class="row"></div>
        </div>

        <!-- Auth Section -->
        <div id="authSection" class="section" style="display: none;">
            <div class="row">
                <div class="col-md-6">
                    <h2>Register</h2>
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="registerEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="registerEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="registerPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="registerPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Register</button>
                    </form>
                </div>
                <div class="col-md-6">
                    <h2>Login</h2>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="loginEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- User Section -->
        <div id="userSection" class="section" style="display: none;">
            <h2>Your Tasks</h2>
            <div id="userTasks" class="row"></div>
            
            <h2 class="mt-4">Your API Key</h2>
            <div class="card">
                <div class="card-body">
                    <code id="apiKeyDisplay"></code>
                    <button class="btn btn-sm btn-primary ms-2" id="copyApiKey">Copy</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
